[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms2query-db"
version = "0.1.0"
description = "Local PostgreSQL spectral-library search with auditable imports and multi-method retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chemap",
    "matchms",
    "ms2deepscore",
    "numpy>=1.24",
    "pandas>=2",
    "scipy>=1.10",
    "SQLAlchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2"
    ]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ms2query-pg = "ms2query_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires TEST_POSTGRES_DSN", "science: requires the user's matchms development branch and chemap"]
