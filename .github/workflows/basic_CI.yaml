name: basic CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ".[test]"
          pytest -q --ignore=tests/integration

  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ms2query
          POSTGRES_PASSWORD: ms2query
          POSTGRES_DB: ms2query_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ms2query -d ms2query_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MS2QUERY_TEST_DSN: postgresql://ms2query:ms2query@127.0.0.1:5432/ms2query_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -e ".[test]"
          pytest -q tests/integration